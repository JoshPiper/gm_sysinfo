[package]
name = "gm_sysinfo"
version = "2.0.0"
edition = "2021"
description = "Garry's Mod binary module exposing system information to Lua"
license = "MIT"
repository = "https://github.com/JoshPiper/gm_sysinfo"
publish = false

[lib]
name = "gm_sysinfo"
crate-type = ["cdylib"]

[features]
gmcl = ["gmod/gmcl"]

[dependencies]
gmod = { version = "17", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[build-dependencies]
built = { version = "0.8", features = ["chrono", "gix"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
