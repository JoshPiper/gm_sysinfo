[package]
name = "gm_sysinfo"
version = "3.0.0"
edition = "2021"
description = "Garry's Mod binary module exposing system information to Lua"
license = "MIT"
repository = "https://github.com/JoshPiper/gm_sysinfo"
readme = "README.md"
keywords = ["garrysmod", "gmod", "binary-module", "sysinfo"]
# Do not add publish = false here: release-plz's release command filters on
# this manifest field and would skip the package entirely ("nothing to
# release"). The crates.io publish opt-out lives in release-plz.toml instead.

[lib]
name = "gm_sysinfo"
crate-type = ["cdylib"]

[features]
gmcl = ["gmod/gmcl"]

[dependencies]
gmod = { version = "17", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[build-dependencies]
built = { version = "0.8", features = ["chrono", "gix"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
