name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.file }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: i686-pc-windows-msvc,     realm: sv, file: gmsv_sysinfo_win32.dll,   built: gm_sysinfo.dll }
          - { os: windows-latest, target: i686-pc-windows-msvc,     realm: cl, file: gmcl_sysinfo_win32.dll,   built: gm_sysinfo.dll }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   realm: sv, file: gmsv_sysinfo_win64.dll,   built: gm_sysinfo.dll }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   realm: cl, file: gmcl_sysinfo_win64.dll,   built: gm_sysinfo.dll }
          - { os: ubuntu-latest,  target: i686-unknown-linux-gnu,   realm: sv, file: gmsv_sysinfo_linux.dll,   built: libgm_sysinfo.so }
          - { os: ubuntu-latest,  target: i686-unknown-linux-gnu,   realm: cl, file: gmcl_sysinfo_linux.dll,   built: libgm_sysinfo.so }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, realm: sv, file: gmsv_sysinfo_linux64.dll, built: libgm_sysinfo.so }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, realm: cl, file: gmcl_sysinfo_linux64.dll, built: libgm_sysinfo.so }
          - { os: macos-latest,   target: x86_64-apple-darwin,      realm: sv, file: gmsv_sysinfo_osx64.dll,   built: libgm_sysinfo.dylib }
          - { os: macos-latest,   target: x86_64-apple-darwin,      realm: cl, file: gmcl_sysinfo_osx64.dll,   built: libgm_sysinfo.dylib }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml: pinned nightly, components, targets.
      - name: Install toolchain
        run: rustup toolchain install

      - name: Install multilib
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # Embeds the resolved dependency tree in the binary itself (a `.dep-v0`
      # linker section), so `cargo audit bin <file>` works on a shipped
      # binary years later, without needing a separate SBOM lookup.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      - name: Build
        shell: bash
        run: cargo auditable build --release --locked --target ${{ matrix.target }} ${{ matrix.realm == 'cl' && '--features gmcl' || '' }}

      - name: Rename output
        shell: bash
        run: mv "target/${{ matrix.target }}/release/${{ matrix.built }}" "${{ matrix.file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
          if-no-files-found: error
